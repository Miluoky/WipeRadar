name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # web typecheck runs `next typegen` first: PageProps/LayoutProps are generated, not committed
      - run: npm run typecheck

  prober:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/prober
      - run: cargo test --manifest-path services/prober/Cargo.toml

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, prober]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          load: true
          tags: wiperadar-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # boot the image and hit the same path the Railway healthcheck uses
      - name: smoke test
        if: matrix.image != 'prober'
        run: |
          if [ "${{ matrix.image }}" = worker ]; then port=4000; path=/api/health; else port=3000; path=/robots.txt; fi
          docker run -d --name smoke -p $port:$port wiperadar-${{ matrix.image }}:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$port$path" >/dev/null; then echo "up after ${i}s"; docker rm -f smoke >/dev/null; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
