[package]
name = "wiperadar-prober"
version = "0.1.0"
edition = "2021"
description = "High-throughput A2S (Valve Server Query) prober for Rust servers"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
